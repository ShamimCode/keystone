spring.application.name=keystone

# =========================
# Database
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/keystone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:keystone}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:keystone}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
keystone.jwt.secret=${JWT_SECRET:local-development-secret-change-this}
keystone.jwt.expiration-ms=86400000

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =========================
# Swagger
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================
# Server
# =========================
server.port=${PORT:8080}