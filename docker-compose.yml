services:
  db:
    image: postgres:16-alpine
    container_name: keystone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "5433:5432"
    volumes:
      - keystone_db_data:/var/lib/postgresql/data

volumes:
  keystone_db_data: